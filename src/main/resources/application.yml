spring:
  application:
    name: xeats-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/xeats?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:xeats_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1500
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${XEATS_SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        secure: ${XEATS_SECURE_COOKIES:false}

xeats:
  security:
    allowed-origins: ${XEATS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    login-max-attempts: ${XEATS_LOGIN_MAX_ATTEMPTS:10}
    login-window: ${XEATS_LOGIN_WINDOW:1m}
    login-lockout: ${XEATS_LOGIN_LOCKOUT:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    org.flywaydb: INFO
